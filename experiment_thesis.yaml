name: "thesis_eval_acled"
description: >
  Thesis evaluation – ACLED data source.

data:
  source_name: acled_data
  limit: null
  use_sample_data: true

# No graphdb: block — falls back to GRAPHDB_URL/GRAPHDB_REPOSITORY from .env,
# which differs between a host-native run (localhost:7200) and docker compose
# (http://graphdb:7200, set in docker-compose.yml's app service). Hardcoding
# a url/repository here would override that env-based fallback in both cases.

mapping:
  mode: generate

matrix:
  provider_models:
    - [openrouter, anthropic/claude-sonnet-5]
    - [openrouter, meta-llama/llama-3.1-70b-instruct]

  strategies:
    - zero_shot
    - few_shot
    - chain_of_thought

  ontology_formats:
    - class_list
    - turtle
    - compact

  include_descriptions:
    - true
