name: "thesis_eval_acled"
description: >
  Thesis evaluation – ACLED data source.

data:
  source_name: acled_data
  limit: null
  use_sample_data: true

mapping:
  mode: generate

matrix:
  provider_models:
    - [openrouter, anthropic/claude-sonnet-5]
    - [openrouter, meta-llama/llama-3.1-70b-instruct]

  strategies:
    - zero_shot
    - few_shot
    - chain_of_thought

  ontology_formats:
    - class_list
    - turtle
    - compact
    - json_ld

  include_descriptions:
    - true
    - false
