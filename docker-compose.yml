services:

  app:
    build: .
    ports:
      - "8420:8000"
    env_file:
      - .env
    environment:
      # Override .env's host-based values so the connectors reach GraphDB (in
      # this compose network) and Postgres/MongoDB/TimescaleDB (running as
      # separate instances on the host machine, not in this compose file) —
      # "localhost" from inside the container means the container itself.
      # Only takes effect for connectors actually used at runtime.
      GRAPHDB_URL: http://graphdb:7200
      POSTGRES_HOST: host.docker.internal
      TIMESCALE_HOST: host.docker.internal
      MONGODB_URI: mongodb://thesis:thesis@host.docker.internal:27017
    volumes:
      # Bind-mount source + data so prompt edits and new runs/mappings show up
      # without a rebuild. Drop --reload from CMD in prod if you don't want
      # live-reload; for thesis experimentation it's convenient to keep.
      - ./src:/app/src
      - ./data:/app/data
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    depends_on:
      graphdb:
        condition: service_healthy
    restart: unless-stopped

  graphdb:
    image: ontotext/graphdb:11.4.2
    ports:
      - "7210:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7200/rest/repositories"]
      interval: 5s
      timeout: 5s
      retries: 30

  graphdb-init:
    image: curlimages/curl:8.21.0
    depends_on:
      graphdb:
        condition: service_healthy
    volumes:
      - ./docker/graphdb/repo-config.ttl:/repo-config.ttl:ro
    entrypoint: >
      sh -c "
        if curl -sf http://graphdb:7200/rest/repositories/bsm >/dev/null 2>&1; then
          echo 'repository bsm already exists, skipping';
        else
          curl -sf -X POST http://graphdb:7200/rest/repositories -F config=@/repo-config.ttl && echo 'repository bsm created' || echo 'auto-create failed - create it manually via http://localhost:7210 (see docker/graphdb/repo-config.ttl)';
        fi
      "

volumes:
  graphdb_data:
