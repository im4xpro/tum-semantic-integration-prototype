# Competency questions for the acled_data source.
# {{graph}} is substituted with the run's named graph URI at evaluation time.
#
# query_type: ask    -> expected is a YAML bool, compared to the ASK result.
# query_type: select -> expected is a list of {var: value} rows, compared as an
#                        unordered multiset (row order doesn't matter).
#
# Seeded with 3 examples verified against the gold mapping over the current
# 5-record sample set (data/schemas/postgres_schema.json) — add more as needed.

- id: cq1_every_action_has_an_actor
  description: "Every bsm:Action has at least one involved Actor (bsm:involvedActor)."
  query_type: ask
  query: |
    PREFIX bsm: <https://thesis.tum.de/baltic-sea-monitoring/ontology#>
    ASK {
      GRAPH <{{graph}}> {
        ?action a bsm:Action .
        FILTER NOT EXISTS { ?action bsm:involvedActor ?actor . }
      }
    }
  expected: false

- id: cq2_action_count
  description: "There are exactly 5 distinct Action instances (one per sample record)."
  query_type: select
  query: |
    PREFIX bsm: <https://thesis.tum.de/baltic-sea-monitoring/ontology#>
    SELECT (COUNT(DISTINCT ?action) AS ?n) WHERE {
      GRAPH <{{graph}}> { ?action a bsm:Action }
    }
  expected:
    - n: "5"

- id: cq3_organisation_count
  description: "There are exactly 10 distinct Organisation instances (actor1/assoc_actor_1/actor2/assoc_actor_2 across 5 records)."
  query_type: select
  query: |
    PREFIX bsm: <https://thesis.tum.de/baltic-sea-monitoring/ontology#>
    SELECT (COUNT(DISTINCT ?org) AS ?n) WHERE {
      GRAPH <{{graph}}> { ?org a bsm:Organisation }
    }
  expected:
    - n: "10"
