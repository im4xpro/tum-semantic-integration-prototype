<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mapping Diff</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #21262d;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --warn:    #c0392b;
    }

    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.5; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 14px; font-weight: 600; }
    header a { color: var(--muted); text-decoration: none; font-size: 12px; }
    header a:hover { color: var(--text); }
    .run-meta { display: flex; margin-left: auto; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .run-meta span { padding: 3px 10px; font-size: 11px; color: var(--muted); border-right: 1px solid var(--border); font-family: ui-monospace, monospace; }
    .run-meta span:last-child { border-right: none; }
    .run-meta span b { color: var(--text); font-weight: 500; }

    .container { max-width: 1300px; margin: 0 auto; padding: 20px; }

    /* ── Subject block ── */
    .subject-block { border: 1px solid var(--border); margin-bottom: 10px; }
    .subject-header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--surface); cursor: pointer; user-select: none; }
    .subject-header:hover { background: #1c2128; }
    .subject-title { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
    .subject-sub   { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }
    .chevron { margin-left: auto; color: var(--muted); font-size: 10px; transition: transform .15s; }
    .subject-block.open .chevron { transform: rotate(90deg); }
    .subject-body { display: none; border-top: 1px solid var(--border); }
    .subject-block.open .subject-body { display: block; }

    /* ── Mapping table ── */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 6px 14px; font-size: 10.5px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: var(--surface); }
    th.sep { border-left: 2px solid var(--border); }
    td { padding: 5px 14px; border-bottom: 1px solid var(--border); font-family: ui-monospace, monospace; font-size: 11.5px; }
    td.sep { border-left: 2px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2128; }

    .td-fields { color: var(--text); font-weight: 500; min-width: 160px; }
    .td-pred         { color: var(--muted); }
    .td-pred.missing { color: var(--border); font-style: italic; }
    .td-pred.problem { color: var(--warn); }

    /* ── Summary bar ── */
    .summary-bar { display: flex; gap: 32px; padding: 14px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .stat { display: flex; flex-direction: column; gap: 3px; }
    .stat .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .stat .val { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .stat-divider { width: 1px; background: var(--border); margin: 4px 0; }

    /* ── Legend ── */
    .legend { margin-bottom: 16px; font-size: 12px; color: var(--muted); }
    .legend span { margin-right: 16px; }

    /* ── Utils ── */
    .msg { padding: 24px; text-align: center; color: var(--muted); }
    .err { color: var(--fn); background: var(--fn-bg); border: 1px solid var(--fn); padding: 12px 16px; margin: 16px 0; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #58a6ff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>Mapping Diff</h1>
  <a href="/evaluation">← Evaluation</a>
  <div class="run-meta" id="run-meta"></div>
</header>

<div class="container">
  <div id="root"><div class="msg"><span class="spinner"></span>Loading…</div></div>
</div>

<script>
const runId = new URLSearchParams(location.search).get('run_id');

if (!runId) {
  document.getElementById('root').innerHTML = '<div class="err">No run_id in URL.</div>';
} else {
  fetch(`/api/evaluation/mapping-diff/${runId}`)
    .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail || 'Error')))
    .then(render)
    .catch(e => { document.getElementById('root').innerHTML = `<div class="err">${e}</div>`; });
}

function render(d) {
  document.title = `Diff — ${d.llm_model.split('/').pop()}`;

  document.getElementById('run-meta').innerHTML = [
    `<span><b>${d.llm_model.split('/').pop()}</b></span>`,
    `<span>${d.strategy}</span>`,
    `<span>${d.ontology_format}</span>`,
    d.include_descriptions ? '<span>with desc.</span>' : '',
  ].filter(Boolean).join('');

  if (d.error) { document.getElementById('root').innerHTML = `<div class="err">${d.error}</div>`; return; }

  const summary = `
    <div class="summary-bar">
      <div class="stat"><span class="lbl">F1</span><span class="val">${(d.f1*100).toFixed(1)}%</span></div>
      <div class="stat"><span class="lbl">Precision</span><span class="val">${(d.precision*100).toFixed(1)}%</span></div>
      <div class="stat"><span class="lbl">Recall</span><span class="val">${(d.recall*100).toFixed(1)}%</span></div>
      <div class="stat-divider"></div>
      <div class="stat"><span class="lbl">Correct</span><span class="val">${d.tp}</span></div>
      <div class="stat"><span class="lbl">Missing</span><span class="val">${d.fn}</span></div>
      <div class="stat"><span class="lbl">Wrong / Extra</span><span class="val">${d.fp}</span></div>
    </div>
    <div class="legend">
      <span>Predicates highlighted in red are incorrect — either wrong, missing, or unexpected.</span>
    </div>`;

  document.getElementById('root').innerHTML = summary + d.subject_diffs.map((sd, i) => renderSubject(sd, i)).join('');
}

function renderSubject(sd, i) {
  const rows = sd.field_diffs.map(fd => {
    const ok = fd.status === 'match';
    const gp = fd.gold_predicate      ? esc(fd.gold_predicate)      : '—';
    const np = fd.generated_predicate ? esc(fd.generated_predicate) : '—';
    const gcls = ok ? 'td-pred' : fd.gold_predicate      ? 'td-pred problem' : 'td-pred missing';
    const ncls = ok ? 'td-pred' : fd.generated_predicate ? 'td-pred problem' : 'td-pred missing';
    return `<tr>
      <td class="td-fields">${esc(fd.source_fields.join(' + '))}</td>
      <td class="${gcls}">${gp}</td>
      <td class="${ncls} sep">${np}</td>
    </tr>`;
  }).join('');

  return `
    <div class="subject-block open" id="sm-${i}">
      <div class="subject-header" onclick="document.getElementById('sm-${i}').classList.toggle('open')">
        <span class="subject-title">${esc(sd.class_uri)}</span>
        <span class="subject-sub">subject: ${esc(sd.subject_column)}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="subject-body">
        <table>
          <thead><tr>
            <th>Source fields</th>
            <th>Gold Standard</th>
            <th class="sep">Generated</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
