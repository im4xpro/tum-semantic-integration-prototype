[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tum-semantic-integration-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary",
    "pymongo",
    "neo4j",
    "rdflib",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
    "anthropic",
    "openai",
    "rapidfuzz",
    "chromadb",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pandas",
    "pyyaml",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",  # required by fastapi.testclient.TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
# Mirror the scripts' `PYTHONPATH=src` so `import pipeline` / `import api` resolve.
pythonpath = ["src"]
testpaths = ["tests"]